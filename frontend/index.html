<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniPods Group Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F5F3;
  --surface: #FFFFFF;
  --ink: #16262B;
  --ink-soft: #566A70;
  --line: #D3DDD9;
  --chat: #0B7A75;
  --chat-tint: #E3F2F0;
  --call: #4A3FB5;
  --call-tint: #ECEAFA;
  --signal: #E9A820;
  --signal-tint: #FDF3DC;
  --danger: #B3372B;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --rail: 19rem;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1rem/1.55 var(--body);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--call); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100%; }

/* ------------------------------------------------------------ rail */
.rail {
  border-right: 1px solid var(--line); padding: 1.5rem 1.25rem; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.75rem; background: var(--paper);
}
.brand { font: 700 1.25rem/1.15 var(--display); letter-spacing: -0.02em; margin: 0; }
.brand small { display: block; font: 400 0.85rem/1.4 var(--body); letter-spacing: 0; color: var(--ink-soft); margin-top: 0.35rem; }
.rail h2 { font: 700 1rem/1.2 var(--display); margin: 0 0 0.6rem; }
.field { display: block; margin-bottom: 0.7rem; }
.field span { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 0.2rem; }
select, input[type="password"] {
  width: 100%; padding: 0.55rem 0.6rem; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
.btn {
  background: var(--ink); color: #fff; border: 0; border-radius: 8px;
  padding: 0.6rem 1rem; font-weight: 600; min-height: 2.75rem;
}
.btn:hover { background: #22383F; }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.block { width: 100%; }
.stats { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { background: var(--surface); border: 0; padding: 0.4rem 0.8rem; min-height: 2.25rem; }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
details.settings summary { cursor: pointer; font-weight: 600; }
details.settings > div { margin-top: 0.75rem; }

/* ------------------------------------------------------------ conversation */
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar { display: none; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
.topbar .brand { font-size: 1.05rem; }
.log { flex: 1; overflow-y: auto; padding: 1.5rem clamp(1rem, 4vw, 3rem) 1rem; scroll-behavior: smooth; }
.log-inner { max-width: 46rem; margin: 0 auto; }

.empty { padding: 8vh 0 2rem; }
.empty h2 { font: 700 clamp(1.8rem, 4.4vw, 2.7rem)/1.08 var(--display); letter-spacing: -0.03em; margin: 0 0 0.8rem; max-width: 16ch; }
.empty p { color: var(--ink-soft); max-width: 44ch; margin: 0 0 1.5rem; }
.suggest { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-width: 34rem; }
.suggest li { border-bottom: 1px solid var(--line); }
.suggest button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.8rem 0.25rem; }
.suggest button:hover { background: var(--surface); }

.msg { margin: 0 0 1.75rem; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user p { margin: 0; max-width: 85%; background: var(--ink); color: #fff; padding: 0.6rem 0.9rem; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Le "fil" : chaque réponse est accrochée à une ligne verticale, ses sources en découlent. */
.msg.bot { border-left: 3px solid var(--line); padding-left: 1rem; }
.msg.bot.digest { border-left-color: var(--signal); }
.msg.bot.error { border-left-color: var(--danger); }
.answer { max-width: 42rem; overflow-wrap: anywhere; }
.answer p { margin: 0 0 0.7rem; }
.answer ul { margin: 0 0 0.7rem; padding-left: 1.2rem; }
.answer a { color: var(--call); text-underline-offset: 2px; }
.answer h3 { font: 700 1.05rem/1.3 var(--display); margin: 0 0 0.4rem; }
.meta { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 0.6rem; }
.notice { background: var(--signal-tint); border-left: 3px solid var(--signal); padding: 0.45rem 0.7rem; margin: 0 0 0.8rem; font-size: 0.92rem; max-width: 42rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 0.8rem; padding: 0; list-style: none; }
.chips li { font-size: 0.8rem; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 99px; padding: 0.1rem 0.6rem; }
.cite {
  font-size: 0.72rem; font-weight: 600; min-width: 1.35rem; height: 1.35rem; padding: 0 0.25rem; margin: 0 0.1rem;
  vertical-align: 0.15em; border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
}
.cite:hover { border-color: var(--ink); }

.sources { margin: 0.9rem 0 0; max-width: 42rem; }
.sources > h3 { font: 600 0.9rem/1.2 var(--body); color: var(--ink-soft); margin: 0 0 0.4rem; }
.src { border-left: 4px solid var(--chat); background: var(--chat-tint); margin: 0 0 0.4rem; border-radius: 0 8px 8px 0; }
.src[data-type="call"] { border-left-color: var(--call); background: var(--call-tint); }
.src summary { list-style: none; cursor: pointer; padding: 0.5rem 0.75rem; display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
.src summary::-webkit-details-marker { display: none; }
.src .n { font-weight: 700; }
.src .kind { font-size: 0.82rem; font-weight: 600; color: var(--chat); }
.src[data-type="call"] .kind { color: var(--call); }
.src .when { font-size: 0.82rem; color: var(--ink-soft); margin-left: auto; }
.src pre { margin: 0; padding: 0 0.75rem 0.75rem; font: 400 0.88rem/1.5 var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
.src.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--signal); } to { box-shadow: 0 0 0 3px transparent; } }

.thinking { color: var(--ink-soft); display: flex; align-items: center; gap: 0.6rem; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: pulse 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* ------------------------------------------------------------ composer */
.composer { border-top: 1px solid var(--line); background: var(--paper); padding: 0.75rem clamp(1rem, 4vw, 3rem) 1rem; }
.composer-inner { max-width: 46rem; margin: 0 auto; }
.scope { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 0.6rem; }
.scope button { background: var(--surface); border: 0; padding: 0.35rem 0.85rem; font-size: 0.88rem; min-height: 2.25rem; }
.scope button[aria-pressed="true"][data-scope=""] { background: var(--ink); color: #fff; }
.scope button[aria-pressed="true"][data-scope="chat"] { background: var(--chat); color: #fff; }
.scope button[aria-pressed="true"][data-scope="call"] { background: var(--call); color: #fff; }
.row { display: flex; gap: 0.6rem; align-items: flex-end; }
textarea {
  flex: 1; resize: none; max-height: 9rem; padding: 0.65rem 0.8rem; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; line-height: 1.4;
}

/* ------------------------------------------------------------ mobile */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .topbar { display: flex; }
  .rail { display: none; border-right: 0; border-bottom: 1px solid var(--line); max-height: 70dvh; }
  body.rail-open .rail { display: flex; }
  .app { grid-template-rows: auto 1fr; }
  .rail { grid-row: 1; }
  .main { grid-row: 2; }
  .rail .brand { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Tools">
    <h1 class="brand">UniPods Group Intelligence <small data-i18n="tagline"></small></h1>

    <section aria-labelledby="catchup-h">
      <h2 id="catchup-h" data-i18n="catchup"></h2>
      <label class="field"><span data-i18n="period"></span>
        <select id="period">
          <option value="24h" data-i18n="p24h"></option>
          <option value="today" data-i18n="ptoday"></option>
          <option value="yesterday" data-i18n="pyesterday"></option>
          <option value="7d" data-i18n="p7d"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="source"></span>
        <select id="digest-scope">
          <option value="" data-i18n="all"></option>
          <option value="chat" data-i18n="chats"></option>
          <option value="call" data-i18n="calls"></option>
        </select>
      </label>
      <button class="btn block" id="digest-btn" type="button" data-i18n="getDigest"></button>
    </section>

    <p class="stats" id="stats" aria-live="polite"></p>

    <details class="settings">
      <summary data-i18n="settings"></summary>
      <div>
        <div class="field"><span data-i18n="language"></span>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="fr" aria-pressed="false">FR</button>
          </div>
        </div>
        <label class="field"><span data-i18n="apiKey"></span>
          <input type="password" id="api-key" autocomplete="off" spellcheck="false">
        </label>
      </div>
    </details>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 class="brand">UniPods Group Intelligence</h1>
      <button class="btn" id="rail-toggle" type="button" aria-expanded="false" aria-controls="rail" data-i18n="catchup"></button>
    </div>
    <main class="log" id="log" aria-live="polite" aria-label="Conversation">
      <div class="log-inner" id="log-inner"></div>
    </main>
    <div class="composer">
      <div class="composer-inner">
        <div class="scope" role="group" aria-label="Search in">
          <button type="button" data-scope="" aria-pressed="true" data-i18n="all"></button>
          <button type="button" data-scope="chat" aria-pressed="false" data-i18n="chats"></button>
          <button type="button" data-scope="call" aria-pressed="false" data-i18n="calls"></button>
        </div>
        <div class="row">
          <label class="sr-only" for="q" data-i18n="askLabel"></label>
          <textarea id="q" rows="1" maxlength="1000" data-i18n-placeholder="placeholder"></textarea>
          <button class="btn" id="send" type="button" data-i18n="ask"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const API_BASE = window.UNIPODS_API || "";
const T = {
  en: {
    tagline: "Ask what the group said. Answers come with sources.",
    catchup: "Catch me up", period: "Period", source: "Look in", all: "Everything", chats: "Chats", calls: "Calls",
    p24h: "Last 24 hours", ptoday: "Today", pyesterday: "Yesterday", p7d: "Last 7 days",
    getDigest: "Get the digest", settings: "Settings", language: "Language", apiKey: "API key (if the service asks for one)",
    askLabel: "Your question", placeholder: "Ask about a decision, a link, a call…", ask: "Ask",
    emptyTitle: "Ask what the group said.",
    emptyText: "Answers come from the group chat and call transcripts, with sources you can open.",
    s1: "What were the key action items from yesterday's call?", s2: "Has anyone shared the submission link yet?",
    s3: "What did we decide about the vector database?", s4: "What happened in the chat today?",
    thinking: "Searching the group's memory…", sources: "Sources", widened: "Nothing matched that period, so this looks at all dates.",
    digestTitle: "Digest", links: "Links shared", chatKind: "Chat", callKind: "Call", searched: "Searched",
    msgs: (n, a) => `${n} message${n === 1 ? "" : "s"} from ${a} ${a === 1 ? "person" : "people"}`,
    callsN: (n) => `${n} call${n === 1 ? "" : "s"}`, indexed: (m, c) => `${m} messages and ${c} calls indexed`,
    errNet: "Can't reach the service. Check that it is running, then try again.",
    errAuth: "The API key is missing or wrong. Add it under Settings, then try again.",
    errGeneric: (s) => `The service returned an error (${s}). Try again in a moment.`,
    errBad: "That request was not valid. Try rephrasing your question.",
  },
  fr: {
    tagline: "Demandez ce que le groupe a dit. Chaque réponse cite ses sources.",
    catchup: "Me remettre à jour", period: "Période", source: "Chercher dans", all: "Tout", chats: "Chats", calls: "Appels",
    p24h: "Dernières 24 heures", ptoday: "Aujourd'hui", pyesterday: "Hier", p7d: "7 derniers jours",
    getDigest: "Voir le résumé", settings: "Réglages", language: "Langue", apiKey: "Clé d'API (si le service en demande une)",
    askLabel: "Votre question", placeholder: "Posez une question sur une décision, un lien, un appel…", ask: "Demander",
    emptyTitle: "Demandez ce que le groupe a dit.",
    emptyText: "Les réponses viennent du chat du groupe et des transcriptions d'appels, avec des sources à ouvrir.",
    s1: "Quelles étaient les actions clés de l'appel d'hier ?", s2: "Quelqu'un a-t-il partagé le lien de soumission ?",
    s3: "Qu'avons-nous décidé pour la base de données vectorielle ?", s4: "Que s'est-il passé dans le chat aujourd'hui ?",
    thinking: "Recherche dans la mémoire du groupe…", sources: "Sources", widened: "Rien ne correspondait à cette période, la recherche couvre donc toutes les dates.",
    digestTitle: "Résumé", links: "Liens partagés", chatKind: "Chat", callKind: "Appel", searched: "Recherche",
    msgs: (n, a) => `${n} message${n > 1 ? "s" : ""} de ${a} personne${a > 1 ? "s" : ""}`,
    callsN: (n) => `${n} appel${n > 1 ? "s" : ""}`, indexed: (m, c) => `${m} messages et ${c} appels indexés`,
    errNet: "Impossible de joindre le service. Vérifiez qu'il est démarré, puis réessayez.",
    errAuth: "La clé d'API est absente ou incorrecte. Ajoutez-la dans Réglages, puis réessayez.",
    errGeneric: (s) => `Le service a renvoyé une erreur (${s}). Réessayez dans un instant.`,
    errBad: "La requête n'était pas valide. Essayez de reformuler votre question.",
  },
};

const state = { lang: (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en", scope: "", key: "", busy: false };
try { state.key = sessionStorage.getItem("unipods_key") || ""; const l = localStorage.getItem("unipods_lang"); if (l) state.lang = l; } catch (_) {}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const t = (k, ...a) => { const v = T[state.lang][k]; return typeof v === "function" ? v(...a) : v; };
const log = $("#log"), inner = $("#log-inner"), input = $("#q"), sendBtn = $("#send"), digestBtn = $("#digest-btn");

function applyLang() {
  document.documentElement.lang = state.lang;
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  if (!inner.dataset.started) renderEmpty();
  loadStats();
}

// ---------------------------------------------------------------- rendu sûr (échappement AVANT tout balisage)
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  return s.replace(/\[(\d{1,2})\]/g, '<button type="button" class="cite" data-cite="$1" aria-label="Source $1">$1</button>');
}
function richText(text) {
  let html = "", list = false;
  for (const raw of text.split("\n")) {
    const m = raw.match(/^\s*[-*\u2022]\s+(.*)$/);
    if (m) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(m[1])}</li>`; }
    else { if (list) { html += "</ul>"; list = false; } if (raw.trim()) html += `<p>${inline(raw)}</p>`; }
  }
  return html + (list ? "</ul>" : "");
}
const fmt = iso => new Intl.DateTimeFormat(state.lang, { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));

// ---------------------------------------------------------------- vues
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function scrollDown() { log.scrollTop = log.scrollHeight; }
function push(node) { inner.dataset.started = "1"; inner.querySelector(".empty")?.remove(); inner.appendChild(node); scrollDown(); return node; }

function renderEmpty() {
  inner.innerHTML = `<section class="empty"><h2>${esc(t("emptyTitle"))}</h2><p>${esc(t("emptyText"))}</p>
    <ul class="suggest">${["s1", "s2", "s3", "s4"].map(k => `<li><button type="button" data-suggest="${k}">${esc(t(k))}</button></li>`).join("")}</ul></section>`;
}
function thinking() {
  return push(el(`<div class="msg bot"><div class="thinking"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(t("thinking"))}</span></div></div>`));
}
function errorMsg(err) {
  const text = err.status === 401 ? t("errAuth") : err.status === 422 ? t("errBad") : err.status ? t("errGeneric", err.status) : t("errNet");
  return `<div class="msg bot error"><div class="answer"><p>${esc(text)}</p></div></div>`;
}
function sourcesHtml(sources) {
  if (!sources.length) return "";
  return `<div class="sources"><h3>${esc(t("sources"))}</h3>${sources.map(s => `
    <details class="src" data-type="${esc(s.source_type)}" data-idx="${s.index}">
      <summary><span class="n">[${s.index}]</span><span class="kind">${esc(t(s.source_type === "call" ? "callKind" : "chatKind"))}</span>
        <span>${esc(s.title)}</span><span class="when">${esc(fmt(s.when))}</span></summary>
      <pre>${esc(s.excerpt)}</pre></details>`).join("")}</div>`;
}
function answerMsg(r) {
  const chips = r.filters_applied.length ? `<ul class="chips" aria-label="${esc(t("searched"))}">${r.filters_applied.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "";
  const notice = r.relaxed ? `<p class="notice">${esc(t("widened"))}</p>` : "";
  return el(`<div class="msg bot"><div class="answer">${notice}${richText(r.answer)}</div>${chips}${sourcesHtml(r.sources)}</div>`);
}
function digestMsg(r) {
  const s = r.stats;
  const parts = [];
  if (s.messages) parts.push(t("msgs", s.messages, s.authors.length));
  if (s.calls.length) parts.push(t("callsN", s.calls.length));
  const links = r.links.length ? `<h3>${esc(t("links"))}</h3><ul>${r.links.map(u => `<li>${inline(u)}</li>`).join("")}</ul>` : "";
  return el(`<div class="msg bot digest"><div class="answer"><h3>${esc(t("digestTitle"))}</h3>
    <p class="meta">${esc(fmt(r.since))} – ${esc(fmt(r.until))}${parts.length ? " · " + esc(parts.join(" · ")) : ""}</p>
    ${richText(r.summary)}${links}</div></div>`);
}

// ---------------------------------------------------------------- réseau
async function api(path, body) {
  const headers = { "Content-Type": "application/json" };
  if (state.key) headers["X-API-Key"] = state.key;
  let res;
  try { res = await fetch(API_BASE + path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (_) { throw new Error("network"); }
  if (!res.ok) { const e = new Error("http"); e.status = res.status; throw e; }
  return res.json();
}
async function loadStats() {
  try { const s = await api("/rag/stats"); $("#stats").textContent = t("indexed", s.messages, s.calls); }
  catch (e) { $("#stats").textContent = e.status === 401 ? t("errAuth") : ""; }
}

async function ask(question) {
  question = question.trim();
  if (!question || state.busy) return;
  state.busy = true; sendBtn.disabled = true;
  push(el(`<div class="msg user"><p>${esc(question)}</p></div>`));
  input.value = ""; autosize();
  const wait = thinking();
  try {
    const body = { question, language: state.lang };
    if (state.scope) body.filters = { source_type: state.scope };
    const r = await api("/rag/ask", body);
    wait.replaceWith(answerMsg(r));
  } catch (e) { wait.replaceWith(el(errorMsg(e))); }
  finally { state.busy = false; sendBtn.disabled = false; scrollDown(); input.focus(); }
}

function periodRange(kind) {
  const now = new Date(), midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
  if (kind === "today") return [midnight, now];
  if (kind === "yesterday") { const y = new Date(midnight); y.setDate(y.getDate() - 1); return [y, midnight]; }
  if (kind === "7d") return [new Date(now - 7 * 864e5), now];
  return [new Date(now - 864e5), now];
}
async function digest() {
  if (state.busy) return;
  state.busy = true; digestBtn.disabled = true; document.body.classList.remove("rail-open");
  const [since, until] = periodRange($("#period").value);
  push(el(`<div class="msg user"><p>${esc(t("catchup"))}: ${esc($("#period").selectedOptions[0].textContent)}</p></div>`));
  const wait = thinking();
  try {
    const body = { since: since.toISOString(), until: until.toISOString(), language: state.lang };
    if ($("#digest-scope").value) body.source_type = $("#digest-scope").value;
    wait.replaceWith(digestMsg(await api("/rag/digest", body)));
  } catch (e) { wait.replaceWith(el(errorMsg(e))); }
  finally { state.busy = false; digestBtn.disabled = false; scrollDown(); }
}

// ---------------------------------------------------------------- événements
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 144) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } });
sendBtn.addEventListener("click", () => ask(input.value));
digestBtn.addEventListener("click", digest);
$("#rail-toggle").addEventListener("click", e => {
  const open = document.body.classList.toggle("rail-open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
$$(".scope button").forEach(b => b.addEventListener("click", () => {
  state.scope = b.dataset.scope;
  $$(".scope button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
$$("[data-lang]").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; try { localStorage.setItem("unipods_lang", state.lang); } catch (_) {}
  applyLang();
}));
$("#api-key").value = state.key;
$("#api-key").addEventListener("change", e => {
  state.key = e.target.value.trim();
  try { sessionStorage.setItem("unipods_key", state.key); } catch (_) {}
  loadStats();
});
log.addEventListener("click", e => {
  const sug = e.target.closest("[data-suggest]");
  if (sug) return ask(t(sug.dataset.suggest));
  const cite = e.target.closest("[data-cite]");
  if (cite) {
    const target = cite.closest(".msg")?.querySelector(`.src[data-idx="${cite.dataset.cite}"]`);
    if (target) { target.open = true; target.scrollIntoView({ block: "nearest" }); target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash"); }
  }
});

applyLang();
</script>
</body>
</html>
